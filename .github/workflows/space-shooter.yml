name: Update space shooter

# Turns the GitHub contribution graph into the space shooter animation at the
# bottom of the profile README and publishes it to the `output` branch, which
# the README links to. Nothing is committed to main.
on:
  schedule:
    - cron: "0 6 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Make the output folder
        run: mkdir -p dist

      - name: Generate the animation
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/gh-space-shooter.gif
          no-commit: "true"

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
